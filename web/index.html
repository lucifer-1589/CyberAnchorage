<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/anchor.svg" />
    <title>CyberAnchorage</title>
    <script>
      try { var t = localStorage.getItem("ca-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
      // Start the session refresh while the JS downloads; refreshSession() consumes this response once.
      window.__caRefresh = fetch("/api/auth/refresh", { method: "POST", credentials: "same-origin" }).catch(function () { return null; });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
