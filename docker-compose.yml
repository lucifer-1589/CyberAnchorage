name: cyberanchorage

x-backend: &backend
  build:
    context: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-anchorage}:${POSTGRES_PASSWORD:-anchorage}@postgres:5432/${POSTGRES_DB:-anchorage}
    REDIS_URL: redis://redis:6379/0
    CTI_DATA_DIR: /cti
    DEMO_CTI_DIR: /data/demo-cti
  volumes:
    # CTI stores are mounted read-only: CyberAnchorage can never write to them.
    - ${CTI_DATA_DIR:-../Darkweb_CTI/Darkweb_CTI}:/cti:ro
    - demo_cti:/data/demo-cti
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anchorage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anchorage}
      POSTGRES_DB: ${POSTGRES_DB:-anchorage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anchorage} -d ${POSTGRES_DB:-anchorage}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m anchorage.cli bootstrap && uvicorn anchorage.main:app --host 0.0.0.0 --port 8077 --proxy-headers"]
    ports:
      - "127.0.0.1:${API_PORT:-8077}:8077"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8077/api/health')"]
      interval: 10s
      retries: 30

  worker:
    <<: *backend
    command: ["python", "-m", "anchorage.worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  demo_cti:
