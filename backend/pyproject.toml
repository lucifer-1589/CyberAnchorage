[project]
name = "cyberanchorage"
version = "0.1.0"
description = "CyberAnchorage threat-detection console - Level 1 backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "redis==5.2.1",
  "apscheduler==3.11.0",
  "httpx==0.28.1",
  "regex==2024.11.6",
  "idna==3.10",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "fakeredis==2.26.2",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "pgserver==0.1.4; platform_system != 'Linux' or platform_machine == 'x86_64'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anchorage*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs PostgreSQL"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "S311", "B008", "RUF012", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
